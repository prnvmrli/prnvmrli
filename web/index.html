<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pranav Murali — Software Engineer specializing in Flutter, client architecture, real-time streaming, and high-performance cross-platform systems.">
  <meta name="theme-color" content="#FBFBFD">

  <!-- Resource Preconnects & DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Non-blocking optimized font loading (Geist removed, only active weights requested) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
  </noscript>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pranav Murali">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Pranav Murali — Software Engineer · Flutter</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background: #FBFBFD;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Instant Minimalist Brand Splash (<15ms FCP) */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #FBFBFD;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease-out, visibility 0.25s ease-out;
      user-select: none;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .splash-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #1D1D1F;
    }

    .splash-role {
      margin-top: 4px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: #636366;
      letter-spacing: 0.3px;
    }

    .splash-loader-bar {
      margin-top: 18px;
      width: 110px;
      height: 2px;
      background: #E5E5EA;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #005CB8;
      border-radius: 99px;
      animation: pulse-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes pulse-slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(280%);
      }
    }
  </style>
</head>
<body>
  <!-- Instant App Shell -->
  <div id="splash-screen" role="status" aria-label="Loading portfolio">
    <div class="splash-card">
      <div class="splash-name">Pranav Murali</div>
      <div class="splash-role">Mobile Systems Engineer</div>
      <div class="splash-loader-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
